<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Coffee Mug</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="container">
        <article class="card-box">
            <div class="img">
                <img src="images/mug.jpg" alt="White ceramic coffee mug placed on table" class="card-image" loading="lazy">
            </div>
            <div class="card-text">
                <p class="product">coffee mug</p>
                <h2 class="product-title">White Coffee Mug</h2>
                <p class="description">Coffee Mugs are designed to express emotions. These are acclaimed for their
                    amazing designs & superior quality.</p>
                <p class="price">
                    <span class="product-title green-text">₹149</span>
                    <span class="description strike">₹230</span>
                </p>
                <button class="btn" aria-label="Add White Coffee Mug to cart">
                    <img src="https://bit.ly/3Q6Adni" alt="" class="btn-image">
                    <span class="description btn-text">Add to Cart</span>
                </button>
            </div>
        </article>
    </section>
</body>

</html>
